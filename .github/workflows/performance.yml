name: Performance comparison
on:
  push:
    branches: [ci/verify-eight-minute-pr-5]
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Open PR number to compare against latest main'
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: performance-${{ github.event.pull_request.number || inputs.pr || 5 }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr || 5 }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name || 'pjlabs/blockless-spring-grpc-example' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned load generator
        run: |
          cd "$RUNNER_TEMP"
          release=https://github.com/bojand/ghz/releases/download/v0.120.0
          curl -fsSLO "$release/ghz-linux-x86_64.tar.gz"
          curl -fsSLO "$release/ghz-linux-x86_64.tar.gz.sha256"
          sha256sum --check ghz-linux-x86_64.tar.gz.sha256
          mkdir -p ghz-bin
          tar -xzf ghz-linux-x86_64.tar.gz -C ghz-bin ghz
          echo "$RUNNER_TEMP/ghz-bin" >> "$GITHUB_PATH"
      - name: Resolve latest main and proposed merge
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          git fetch "https://github.com/$SOURCE_REPOSITORY.git" "+refs/heads/main:refs/remotes/origin/main" "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/benchmark-pr"
          BASE_SHA=$(git rev-parse refs/remotes/origin/main)
          HEAD_SHA=$(git rev-parse refs/remotes/origin/benchmark-pr)
          git worktree add --detach base "$BASE_SHA"
          git worktree add --detach candidate "$BASE_SHA"
          mkdir -p results
          cp base/src/main/proto/greeting.proto results/greeting.proto
          git -C candidate -c user.name=benchmark -c user.email=benchmark@localhost merge --no-edit "$HEAD_SHA"
          CANDIDATE_SHA=$(git -C candidate rev-parse HEAD)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "RUN_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - name: Record environment
        run: |
          mkdir -p results
          java -version > results/java.txt 2>&1
          mvn -version > results/maven.txt
          ghz --version > results/ghz.txt
          lscpu > results/cpu.txt
          env | sort | grep -E '^(BASE_SHA|HEAD_SHA|CANDIDATE_SHA|RUNNER_OS|RUNNER_ARCH)=' > results/metadata.txt
          docker pull postgres:18.1
          docker image inspect postgres:18.1 --format '{{json .RepoDigests}}' > results/postgres-image.json
      - name: Benchmark both builds
        run: bash benchmarks/run.sh
      - name: Generate comparison
        run: |
          python3 benchmarks/report.py
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Update PR comment
        if: (github.event_name == 'workflow_dispatch' && env.SOURCE_REPOSITORY == github.repository) || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue_number = Number(process.env.PR_NUMBER);
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: issue_number})).data;
            if (pr.head.sha !== process.env.HEAD_SHA) {
              core.notice('PR advanced during benchmark; skipping stale comment.');
              return;
            }
            const body = fs.readFileSync('results/report.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number});
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('<!-- blockless-performance -->'));
            if (existing) {
              await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number, body});
            }
      - name: Upload raw results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
